<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VRM AR Camera - Pose Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202535;color:white;font-family:system-ui,sans-serif}canvas{display:block;position:absolute;inset:0;width:100%;height:100%}#ui{position:absolute;z-index:10;left:0;right:0;bottom:0;padding:12px 12px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.85) 25%)}#status{font-size:12px;margin:0 0 8px;text-align:center;white-space:pre-wrap}#poses{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}button{border:0;border-radius:12px;padding:12px 3px;background:#fff;color:#222;font-size:14px;font-weight:700}button.active{background:#8de4ff}#help{font-size:12px;line-height:1.5;text-align:center;margin:9px 0 0;color:#e1e1e1}#ar-slot{position:absolute;z-index:11;top:14px;right:12px}#ar-slot button{position:static!important;transform:none!important;margin:0!important;padding:12px!important;min-width:110px!important;border-radius:12px!important}#log{position:absolute;z-index:12;top:68px;left:10px;right:10px;max-height:28vh;overflow:auto;white-space:pre-wrap;font:11px/1.5 monospace;background:#4a1515e0;border-radius:8px;padding:8px;display:none}#preview-label{position:absolute;top:18px;left:12px;z-index:9;background:#0009;border-radius:7px;padding:7px;font-size:12px}
</style>
<script type="importmap">
{"imports":{"three":"https://esm.sh/three@0.160.0","three/addons/":"https://esm.sh/three@0.160.0/examples/jsm/","@pixiv/three-vrm":"https://esm.sh/@pixiv/three-vrm@2.1.0?external=three"}}
</script>
</head>
<body>
<div id="preview-label">プレビュー（AR未起動）</div>
<div id="ar-slot"></div>
<div id="log"></div>
<div id="ui">
<p id="status">モデル読み込み中…</p>
<div id="poses"><button data-pose="stand" class="active">立つ</button><button data-pose="peace">ピース</button><button data-pose="sit">座る</button><button data-pose="wave">手を振る</button></div>
<p id="help">AR未起動でもポーズ確認OK。AR起動後は地面をゆっくり映してタップで配置。</p>
</div>
<script type="module">
import * as THREE from 'three';
import {ARButton} from 'three/addons/webxr/ARButton.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {VRMLoaderPlugin,VRMUtils} from '@pixiv/three-vrm';

const MODEL_URL='https://raw.githubusercontent.com/Onocul/AR-shikatsun/main/shikatsun.vrm';
const status=document.querySelector('#status'), logBox=document.querySelector('#log'), label=document.querySelector('#preview-label');
function message(s){status.textContent=s}
function error(s){logBox.style.display='block';logBox.textContent+=s+'\n';message(s)}
window.addEventListener('error',e=>error('JS: '+e.message));
window.addEventListener('unhandledrejection',e=>error('Promise: '+(e.reason?.message||e.reason)));

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);
camera.position.set(0,1.2,3);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0,0);renderer.xr.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x8899bb,2.2));
const light=new THREE.DirectionalLight(0xffffff,1.3);light.position.set(1,3,2);scene.add(light);
const grid=new THREE.GridHelper(6,12,0x5e738b,0x3c4658);scene.add(grid);
let vrm=null, modelRoot=null, currentPose='stand', placed=false, loading=true;
let hitTestSource=null,hitTestRequested=false;
const reticle=new THREE.Mesh(new THREE.RingGeometry(.09,.12,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x5effad,side:THREE.DoubleSide}));
reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);

const loader=new GLTFLoader();loader.register(parser=>new VRMLoaderPlugin(parser));
loader.load(MODEL_URL,gltf=>{
 try{
 vrm=gltf.userData.vrm;
 if(!vrm)throw new Error('VRMデータがありません');
 VRMUtils.removeUnnecessaryJoints(gltf.scene);
 modelRoot=vrm.scene;scene.add(modelRoot);
 modelRoot.position.set(0,0,0);modelRoot.scale.setScalar(.75);
 // three-vrm 0.x向け正面補正。モデルの向きによっては変更が必要。
 VRMUtils.rotateVRM0(vrm);
 applyPose(currentPose);
 loading=false;message('読み込み完了！ ポーズを選んでみてね');
 }catch(e){error('モデル設定失敗: '+e.message)}
},undefined,e=>{loading=false;error('VRM読込失敗: '+e.message)});

// normalized boneを使い、モデル間の骨軸差をできるだけ吸収する。
const bone=name=>vrm?.humanoid?.getNormalizedBoneNode(name);
const boneNames=['hips','spine','chest','upperChest','neck','head','leftShoulder','rightShoulder','leftUpperArm','rightUpperArm','leftLowerArm','rightLowerArm','leftUpperLeg','rightUpperLeg','leftLowerLeg','rightLowerLeg','leftHand','rightHand'];
function applyPose(name){
 currentPose=name;
 document.querySelectorAll('[data-pose]').forEach(b=>b.classList.toggle('active',b.dataset.pose===name));
 if(!vrm)return;
 // 直前の姿勢が残らないよう正規化ボーンをリセット
 for(const n of boneNames){const b=bone(n);if(b){b.quaternion.identity()}}
 // 値はモデルの向きによって微調整が必要。静止ポーズ用。
 const rotate=(n,x=0,y=0,z=0)=>{const b=bone(n);if(b)b.rotation.set(x,y,z)};
 if(name==='peace'){
  rotate('rightUpperArm',-.25,0,-1.05);rotate('rightLowerArm',-.25,0,-.8);
  rotate('rightHand',0,0,-.15);
 }else if(name==='wave'){
  rotate('rightUpperArm',0,0,-2.2);rotate('rightLowerArm',0,0,-.65);
 }else if(name==='sit'){
  rotate('leftUpperLeg',-1.2,0,0);rotate('rightUpperLeg',-1.2,0,0);
  rotate('leftLowerLeg',1.25,0,0);rotate('rightLowerLeg',1.25,0,0);
  rotate('spine',.12,0,0);
 }
 // VRM更新で正規化姿勢を実ボーンに反映
 vrm.update(0);
 message('ポーズ: '+({stand:'立つ',peace:'ピース（腕のみ・指は未対応）',sit:'座る',wave:'手を振る（静止）'}[name]));
}
document.querySelectorAll('[data-pose]').forEach(b=>b.addEventListener('click',()=>applyPose(b.dataset.pose)));

const controller=renderer.xr.getController(0);
controller.addEventListener('select',()=>{
 if(!vrm){message('モデルの読み込みを待ってね');return}
 if(!reticle.visible){message('地面を映して緑の輪が出たらタップしてね');return}
 const position=new THREE.Vector3(),quaternion=new THREE.Quaternion(),scale=new THREE.Vector3();
 reticle.matrix.decompose(position,quaternion,scale);
 modelRoot.position.copy(position);modelRoot.quaternion.copy(quaternion);modelRoot.scale.setScalar(.5);
 placed=true;message('配置できたよ！ ポーズを切り替えてみてね');
});scene.add(controller);
const arButton=ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});
document.querySelector('#ar-slot').append(arButton);
renderer.xr.addEventListener('sessionstart',()=>{
 label.style.display='none';grid.visible=false;
 if(modelRoot)modelRoot.visible=false;
 placed=false;hitTestSource=null;hitTestRequested=false;
 message('地面を映して緑の輪が出たらタップ');
});
renderer.xr.addEventListener('sessionend',()=>{
 label.style.display='block';grid.visible=true;reticle.visible=false;
 if(modelRoot){modelRoot.visible=true;modelRoot.position.set(0,0,0);modelRoot.quaternion.identity();modelRoot.scale.setScalar(.75)}
 placed=false;hitTestSource=null;hitTestRequested=false;
 camera.position.set(0,1.2,3);message('プレビューに戻りました');
});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let previousTime=null;
renderer.setAnimationLoop((time,frame)=>{
 const delta=previousTime===null?0:Math.min((time-previousTime)/1000,.05);previousTime=time;
 if(frame){
  const session=renderer.xr.getSession(),ref=renderer.xr.getReferenceSpace();
  if(session&&!hitTestRequested){
   hitTestRequested=true;
   session.requestReferenceSpace('viewer').then(space=>session.requestHitTestSource({space})).then(source=>{hitTestSource=source}).catch(e=>error('Hit Test失敗: '+e.message));
  }
  reticle.visible=false;
  if(hitTestSource&&ref){
   const hits=frame.getHitTestResults(hitTestSource);
   if(hits.length){const pose=hits[0].getPose(ref);if(pose){reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix)}}
  }
  if(modelRoot)modelRoot.visible=placed;
 }
 if(vrm)vrm.update(delta);
 renderer.render(scene,camera);
});
</script>
</body>
</html>
